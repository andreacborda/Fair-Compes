name: Deploy to Surge

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build
      run: npm run build
    
    - name: Deploy to Surge
      run: |
        npm install -g surge
        surge --project ./dist --domain fair-compes-app.surge.sh
      env:
        SURGE_LOGIN: ${{ secrets.SURGE_EMAIL }}
        SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
